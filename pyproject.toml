[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "OboroLabs"
version = "0.1.0"
description = "Reproducible model benchmarks, starting with text-to-image generation in ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oborolabs = "imagebench.cli:main"

[tool.setuptools.packages.find]
include = ["imagebench", "imagebench.*"]
